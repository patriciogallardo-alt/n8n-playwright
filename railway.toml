# railway.toml
# Configuración de Railway para n8n + Puppeteer + Chromium

[build]
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "n8n start"
# No healthcheck en toml — configurar desde el dashboard de Railway
# si lo necesitas, usar path /healthz y timeout de 300s
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
